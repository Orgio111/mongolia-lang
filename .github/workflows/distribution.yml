name: Verify candidate distributions
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v0.1.*']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: python scripts/release/inventory.py
      - run: git diff --exit-code -- release
      - run: test -z "$(git ls-files --others --exclude-standard -- release)"
      - run: cargo install --locked cargo-audit --version 0.22.1
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
  binary:
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: release
        run: python scripts/release/version.py
      - run: rustup target add ${{ matrix.target }}
      - run: cargo fetch --locked
      - run: python -X utf8 scripts/verify.py
      - run: cargo test --release --workspace --locked
      - run: python -X utf8 scripts/release/build_binary.py ${{ matrix.target }} dist
      - run: python -X utf8 scripts/release/verify_binary.py dist/mn-${{ steps.release.outputs.version }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mn-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
  source:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: release
        run: python3 scripts/release/version.py
      - run: python3 scripts/release/source.py dist/mongolia-lang-${{ steps.release.outputs.version }}-source.zip
      - run: unzip -q dist/*.zip -d "$RUNNER_TEMP/source"
      - run: cd "$RUNNER_TEMP/source/mongolia-lang" && sha256sum -c SHA256SUMS && python3 scripts/verify_install.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mn-source
          path: dist/*.zip
          if-no-files-found: error
  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - working-directory: candidate
        run: python3 scripts/phase9_compare.py ../base "$RUNNER_TEMP/base-target" "$RUNNER_TEMP/new-target" > paired.json
      - working-directory: candidate
        run: python3 scripts/release/benchmark_gate.py paired.json
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: paired-performance
          path: candidate/paired.json
